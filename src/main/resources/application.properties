spring.application.name=server

# -----------------------
# MongoDB Configuration
# -----------------------
server.port=8081

# ✅ MongoDB Connection - Production optimized
spring.data.mongodb.uri=mongodb://localhost:27017/fooddb

# ✅ Frontend URLs Configuration
frontend.urls.local=http://localhost:5173
frontend.urls.production=https://restorafood.netlify.app
# frontend.urls.render=https://your-render-frontend-url.onrender.com

# Connection pool settings for better performance
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.connection-timeout=10000
spring.data.mongodb.socket-timeout=10000
spring.data.mongodb.max-connection-idle-time=120000

# ✅ Server Performance Settings
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000ms
server.compression.enabled=true
server.compression.min-response-size=1024
server.shutdown=graceful
server.servlet.session.timeout=30m

# ✅ Spring Performance Optimization
spring.jmx.enabled=false
spring.devtools.restart.enabled=false
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data=WARN

# ✅ Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=userByEmail,userCart

# JWT Configuration
jwt.secret=my_super_secret_key_12345
jwt.expiration=86400000

